<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>SteelBuild Pro TopOut</title>
    <link rel="icon" type="image/svg+xml" href="/brand/topout-mark.svg" />
    <meta name="theme-color" content="#f5f6f8" />
    <script>
      (() => {
        let theme = "light";
        try {
          const saved = localStorage.getItem("theme");
          if (["light", "dark", "system"].includes(saved)) theme = saved;
        } catch {}
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.documentElement.style.backgroundColor = dark ? "#0d1117" : "#f5f6f8";
        document.querySelector('meta[name="theme-color"]').content = dark ? "#0d1117" : "#f5f6f8";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

  </body>

</html>
